[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-staged"
version = "0.1.0"
description = "Staged public interfaces for SAGE"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
